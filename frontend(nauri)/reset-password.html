<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set a new password — Nouri</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="ambient-page">
    <main class="auth-layout">
      <section class="auth-panel" aria-labelledby="reset-title">
        <a class="back" href="login.html">← Back to login</a>
        <a class="brand" href="index.html"><span class="brand-mark">✦</span>Nouri</a>
        <h1 id="reset-title">Set a new password</h1>
        <p>Choose a strong password to secure your account.</p>
        <form data-new-password-form>
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" readonly /></div>
          <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" /></div>
          <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" placeholder="Repeat your password" required minlength="8" autocomplete="new-password" /></div>
          <button class="button full" type="submit">Update password</button>
        </form>
      </section>
    </main>
    <script src="api.js"></script><script src="app.js"></script>
  </body>
</html>
