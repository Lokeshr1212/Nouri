<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — Nouri</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="ambient-page">
    <main class="auth-layout">
      <section class="auth-panel" aria-labelledby="login-title">
        <a class="brand" href="index.html"><span class="brand-mark">✦</span>Nouri</a>
        <h1 id="login-title">Welcome back</h1>
        <p>Log in to pick up where you left off.</p>
        <form data-login-form>
          <div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required /></div>
          <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="••••••••" required /></div>
          <div class="form-row"><label class="checkbox"><input type="checkbox" /> Remember me</label><a class="text-link" href="forgot-password.html">Forgot password?</a></div>
          <button class="button full" type="submit">Log in <span>→</span></button>
        </form>
        <div class="divider">or continue with</div>
        <button class="button full google" type="button" data-google-login><span class="google-mark">G</span>Continue with Google</button>
        <p class="auth-switch">New to Nouri? <a class="text-link" href="register.html">Create a free account</a></p>
      </section>
    </main>
    <script src="api.js"></script><script src="app.js"></script>
  </body>
</html>
