<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account — Nouri</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="ambient-page">
    <main class="auth-layout">
      <section class="auth-panel" aria-labelledby="register-title">
        <a class="back" href="login.html">← Back to login</a>
        <a class="brand" href="index.html"><span class="brand-mark">✦</span>Nouri</a>
        <h1 id="register-title">Create your account</h1>
        <p>Start seeing your nutrition clearly, meal by meal.</p>
        <form data-register-form>
          <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Alex Rivera" required autocomplete="name" /></div>
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" /></div>
          <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" /></div>
          <button class="button full" type="submit">Create account <span>→</span></button>
        </form>
        <p class="auth-switch">Already have an account? <a class="text-link" href="login.html">Log in</a></p>
      </section>
    </main>
    <script src="api.js"></script><script src="app.js"></script>
  </body>
</html>
