<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Nouri</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="ambient-page">
    <main class="auth-layout">
      <section class="auth-panel" aria-labelledby="reset-title">
        <a class="back" href="login.html">← Back to login</a>
        <a class="brand" href="index.html"><span class="brand-mark">✦</span>Nouri</a>
        <h1 id="reset-title">Reset your password</h1>
        <p>Enter your email and we’ll send you a secure reset link.</p>
        <form data-reset-form>
          <div class="field"><label for="reset-email">Email address</label><input id="reset-email" type="email" placeholder="you@example.com" required /></div>
          <button class="button full" type="submit">Send reset link</button>
        </form>
        <div class="success" data-reset-success></div>
        <div class="success" data-reset-token style="margin-top:11px"></div>
      </section>
    </main>
    <script src="api.js"></script><script src="app.js"></script>
  </body>
</html>
