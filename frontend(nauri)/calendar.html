<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Calendar — Nouri</title><link rel="stylesheet" href="styles.css" /></head>
  <body class="app-page" data-calendar>
    <div class="app-shell">
      <aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">✦</span>Nouri</a><nav class="main-nav" aria-label="App navigation"><a class="nav-item" href="dashboard.html"><span class="nav-icon">▦</span>Overview</a><a class="nav-item" href="calorie-counter.html"><span class="nav-icon">♨</span>Calorie counter</a><a class="nav-item active" href="calendar.html"><span class="nav-icon">▣</span>Calendar</a><a class="nav-item" href="diet-planner.html"><span class="nav-icon">☷</span>Diet planner</a><a class="nav-item" href="progress.html"><span class="nav-icon">↗</span>Progress</a></nav><div class="sidebar-bottom"><div class="upgrade"><b>Unlock deeper insights</b><span>See patterns and plan with more precision.</span></div><div class="profile"><span class="profile-avatar">AR</span><div><b>Guest</b><span>free plan</span></div></div><a class="link-button" data-logout href="#" style="justify-content:center;display:flex;font-size:.78rem">Log out</a></div></aside>
      <main class="app-main"><header class="app-header"><div class="date-block"><p>Meal calendar</p><h1>Your week at a glance</h1></div><div class="header-actions"><a class="button ghost" href="diet-planner.html">Edit plan</a><button class="header-icon" aria-label="Notifications">♧</button></div></header>
        <section class="panel calendar-card"><div class="panel-title"><div><p class="eyebrow" data-week-range>This week</p><h2 style="margin-top:6px" data-calendar-title>A balanced week</h2></div><div style="display:flex;gap:8px"><button class="button ghost" data-prev-week type="button">‹ Prev</button><button class="button ghost" data-next-week type="button">Next ›</button></div></div><div class="week-grid" data-week-grid></div></section>
        <div class="planner-grid"><section class="panel panel-pad"><div class="panel-title"><h2 data-day-plan-title>Today</h2><a class="link-button" href="diet-planner.html">Edit plan</a></div><div class="timeline" data-day-plan></div><form data-add-meal-form style="margin-top:18px;display:grid;grid-template-columns:1fr 110px 84px 74px auto;gap:8px;align-items:center"><input name="mealName" aria-label="Meal name" placeholder="Add a meal (e.g. Grilled salmon)" required /><select name="mealType" aria-label="Meal type"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snack">Snack</option></select><input name="mealTime" type="time" aria-label="Time" /><input name="mealCalories" type="number" min="0" placeholder="kcal" aria-label="Calories" /><button class="button" type="submit">Add</button></form></section><section class="panel panel-pad"><div class="panel-title"><h2>Prep today</h2></div><div class="grocery" data-grocery-list></div><div style="display:flex;gap:8px;margin-top:16px"><input data-grocery-input placeholder="Add an item…" aria-label="Grocery item" /><button class="button" data-grocery-add type="button">+</button></div></section></div>
      </main>
    </div>
    <script src="api.js"></script><script src="app.js"></script>
  </body>
</html>
